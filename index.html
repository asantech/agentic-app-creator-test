<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    body {
      min-height: 100vh;
      background: #f8f9fa;
    }

    .page-shell {
      min-height: 100vh;
    }

    .intro-panel {
      background: linear-gradient(135deg, #0d6efd, #084298);
      color: #fff;
    }

    .form-card {
      border: 0;
      border-radius: 1rem;
      box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body>
  <main class="page-shell d-flex align-items-center py-5">
    <div class="container">
      <div class="row g-4 align-items-center">
        <section class="col-12 col-lg-6">
          <div class="intro-panel rounded-4 p-4 p-md-5 h-100">
            <p class="text-uppercase fw-semibold small mb-3">Get in touch</p>
            <h1 class="display-5 fw-bold mb-3">We would love to hear from you.</h1>
            <p class="lead mb-0">Send us a message using the form and we will get back to you as soon as possible.</p>
          </div>
        </section>

        <section class="col-12 col-lg-6">
          <div class="card form-card">
            <div class="card-body p-4 p-md-5">
              <h2 class="h3 mb-4">Contact us</h2>
              <form id="contactForm" novalidate>
                <div class="mb-3">
                  <label for="name" class="form-label">Name</label>
                  <input type="text" class="form-control" id="name" name="name" autocomplete="name" required>
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="mb-4">
                  <label for="message" class="form-label">Message</label>
                  <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">Send message</button>
                <div id="formStatus" class="form-text mt-3" role="status" aria-live="polite"></div>
              </form>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const status = document.getElementById('formStatus');
      if (!this.checkValidity()) {
        status.textContent = 'Please complete all required fields.';
        this.classList.add('was-validated');
        return;
      }
      status.textContent = 'Thanks for your message.';
    });
  </script>
</body>
</html>
