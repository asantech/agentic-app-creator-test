<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <section class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="card-title h3 mb-4">Contact Us</h1>

            <form id="contactForm" novalidate>
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="name" autocomplete="name" required>
                <div class="invalid-feedback">Please enter your name.</div>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
                <div class="invalid-feedback">Please enter a valid email address.</div>
              </div>

              <div class="mb-3">
                <label for="subject" class="form-label">Subject</label>
                <select class="form-select" id="subject" name="subject" required>
                  <option value="" selected disabled>Select a subject</option>
                  <option value="general">General question</option>
                  <option value="support">Technical support</option>
                  <option value="feedback">Feedback</option>
                </select>
                <div class="invalid-feedback">Please select a subject.</div>
              </div>

              <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                <div class="invalid-feedback">Please enter a message.</div>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="subscribe" name="subscribe" value="yes">
                <label class="form-check-label" for="subscribe">Subscribe to updates</label>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Send message</button>
                <button type="reset" class="btn btn-outline-secondary">Clear</button>
              </div>

              <div id="formStatus" class="alert alert-success mt-4 d-none" role="status" aria-live="polite">
                Thanks! Your message has been submitted.
              </div>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const form = document.getElementById('contactForm');
      const status = document.getElementById('formStatus');

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        form.classList.add('was-validated');
        status.classList.add('d-none');

        if (!form.checkValidity()) {
          return;
        }

        status.classList.remove('d-none');
      });

      form.addEventListener('reset', () => {
        form.classList.remove('was-validated');
        status.classList.add('d-none');
      });
    })();
  </script>
</body>
</html>
