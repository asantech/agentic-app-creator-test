<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حذف امن مخزن</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<main class="card">
  <h1>ابزار امن حذف فایل‌های مخزن</h1>
  <p>این ابزار ابتدا پیش‌نمایش می‌گیرد. ریشهٔ مخزن و موارد مستثنا حذف نمی‌شوند.</p>
  <div id="root-status">ریشه هنوز بررسی نشده است.</div>
  <button id="preview">نمایش پیش‌نمایش</button>
  <section id="preview-result" hidden><h2>پیش‌نمایش</h2><div id="lists"></div>
    <div class="warning">هشدار: حذف واقعی غیرقابل‌بازگشت است.</div>
    <label><input id="confirm" type="checkbox"> حذف همهٔ موارد قابل حذف را تأیید می‌کنم.</label>
    <button id="delete" disabled>حذف واقعی</button>
  </section>
  <pre id="result" aria-live="polite"></pre>
</main><script src="/static/app.js"></script></body></html>
