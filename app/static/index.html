<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>حذف امن فایل‌های مخزن</title><link rel="stylesheet" href="/static/styles.css"></head>
<body>
<main class="card">
  <h1>حذف امن فایل‌های مخزن</h1>
  <p>ابتدا پیش‌نمایش بگیرید. ریشهٔ مخزن حفظ می‌شود و <code>.git</code> حذف نخواهد شد.</p>
  <section class="actions"><button id="preview">پیش‌نمایش</button><button id="confirm" disabled>تأیید و حذف واقعی</button></section>
  <p id="status" role="status">هنوز پیش‌نمایشی انجام نشده است.</p>
  <section><h2>موارد قابل حذف</h2><ul id="deletable"></ul></section>
  <section><h2>موارد مستثنا</h2><ul id="excluded"></ul></section>
</main><script src="/static/app.js"></script>
</body></html>
