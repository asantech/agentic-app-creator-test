<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>درخواست وام</title>
  <style>
    :root {
      font-family: Tahoma, Arial, sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .loan-form-container {
      width: min(100%, 720px);
      padding: 32px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.1);
    }

    h1 {
      margin: 0 0 28px;
      color: #111827;
      font-size: 1.8rem;
      text-align: center;
    }

    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.95rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font: inherit;
      direction: rtl;
    }

    input:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    button {
      grid-column: 1 / -1;
      margin-top: 8px;
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      background: #2563eb;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    @media (max-width: 600px) {
      .loan-form-container {
        padding: 24px 18px;
      }

      form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="loan-form-container">
    <h1>درخواست وام</h1>
    <form action="#" method="post">
      <div class="field">
        <label for="full-name">نام و نام خانوادگی</label>
        <input id="full-name" name="full_name" type="text" required>
      </div>

      <div class="field">
        <label for="age">سن</label>
        <input id="age" name="age" type="number" min="0" required>
      </div>

      <div class="field">
        <label for="score">امتیاز</label>
        <input id="score" name="score" type="number" min="0" required>
      </div>

      <div class="field">
        <label for="requested-loan">میزان وام درخواستی</label>
        <input id="requested-loan" name="requested_loan" type="number" min="0" required>
      </div>

      <div class="field">
        <label for="salary">حقوق</label>
        <input id="salary" name="salary" type="number" min="0" required>
      </div>

      <div class="field">
        <label for="salary-deduction">کسر از حقوق</label>
        <input id="salary-deduction" name="salary_deduction" type="number" min="0" required>
      </div>

      <div class="field">
        <label for="collateral">مقدار وثیقه</label>
        <input id="collateral" name="collateral" type="number" min="0" required>
      </div>

      <div class="field">
        <label for="job">شغل</label>
        <input id="job" name="job" type="text" required>
      </div>

      <div class="field">
        <label for="work-experience">سنوات کاری</label>
        <input id="work-experience" name="work_experience" type="number" min="0" required>
      </div>

      <button type="submit">تایید</button>
    </form>
  </main>
</body>
</html>
