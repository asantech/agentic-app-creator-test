<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>درخواست وام</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f4f6f8;
      color: #222;
      font-family: Tahoma, Arial, sans-serif;
    }

    form {
      width: min(100%, 520px);
      padding: 28px;
      border: 1px solid #d9dee3;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 24px;
      text-align: center;
      font-size: 1.6rem;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #bfc7cf;
      border-radius: 6px;
      font: inherit;
    }

    input:focus {
      outline: 2px solid #8ab4f8;
      border-color: #4285f4;
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 11px 16px;
      border: 0;
      border-radius: 6px;
      background: #1769aa;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button:hover {
      background: #12558b;
    }
  </style>
</head>
<body>
  <form dir="rtl" aria-labelledby="form-title">
    <h1 id="form-title">درخواست وام</h1>

    <div class="field">
      <label for="full-name">نام و نام خانوادگی</label>
      <input id="full-name" name="full-name" type="text">
    </div>

    <div class="field">
      <label for="age">سن</label>
      <input id="age" name="age" type="number">
    </div>

    <div class="field">
      <label for="score">امتیاز</label>
      <input id="score" name="score" type="number">
    </div>

    <div class="field">
      <label for="requested-loan">میزان وام درخواستی</label>
      <input id="requested-loan" name="requested-loan" type="number">
    </div>

    <div class="field">
      <label for="salary">حقوق</label>
      <input id="salary" name="salary" type="number">
    </div>

    <div class="field">
      <label for="salary-deduction">کسر از حقوق</label>
      <input id="salary-deduction" name="salary-deduction" type="number">
    </div>

    <div class="field">
      <label for="collateral">مقدار وثیقه</label>
      <input id="collateral" name="collateral" type="number">
    </div>

    <div class="field">
      <label for="job">شغل</label>
      <input id="job" name="job" type="text">
    </div>

    <div class="field">
      <label for="work-experience">سنوات کاری</label>
      <input id="work-experience" name="work-experience" type="number">
    </div>

    <button type="submit">تایید</button>
  </form>
</body>
</html>
