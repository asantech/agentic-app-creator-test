<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>فرم تماس</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Tahoma, Arial, sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    main {
      width: min(100%, 34rem);
      background: #ffffff;
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 0.5rem 2rem rgb(15 23 42 / 12%);
    }

    h1 { margin-top: 0; color: #111827; }
    p { line-height: 1.8; }

    form {
      display: grid;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 700;
    }

    input, textarea, button {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 0.5rem;
      font: inherit;
      padding: 0.75rem;
    }

    textarea { min-height: 8rem; resize: vertical; }
    button { cursor: pointer; color: #ffffff; background: #2563eb; border-color: #2563eb; }
    button:hover { background: #1d4ed8; }
    .hint { margin: 0; color: #64748b; font-size: 0.9rem; }
    .message { min-height: 1.6rem; margin: 0; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>با ما در تماس باشید</h1>
    <p>برای ارسال پرسش یا پیشنهاد، فرم زیر را تکمیل کنید.</p>

    <form id="contact-form" dir="rtl">
      <div>
        <label for="name">نام و نام خانوادگی</label>
        <input id="name" name="name" type="text" placeholder="نام خود را وارد کنید" required>
      </div>

      <div>
        <label for="email">نشانی ایمیل</label>
        <input id="email" name="email" type="email" placeholder="ایمیل خود را وارد کنید" required>
      </div>

      <div>
        <label for="message">پیام شما</label>
        <textarea id="message" name="message" placeholder="پیام خود را بنویسید" required></textarea>
        <p class="hint">لطفاً پیام خود را با جزئیات لازم بنویسید.</p>
      </div>

      <button type="submit">ارسال پیام</button>
      <p id="form-status" class="message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById('contact-form');
    const status = document.getElementById('form-status');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      status.textContent = 'پیام شما با موفقیت آماده ارسال شد.';
      form.reset();
    });
  </script>
</body>
</html>
