<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f6f8;
        color: #1f2933;
      }

      main {
        width: min(90%, 32rem);
        padding: 2rem;
        background: white;
        border: 1px solid #d9e2ec;
        border-radius: 0.75rem;
        box-shadow: 0 0.5rem 1.5rem rgb(31 41 51 / 10%);
      }

      form {
        display: grid;
        gap: 0.75rem;
      }

      label {
        font-weight: 600;
      }

      input,
      button {
        box-sizing: border-box;
        width: 100%;
        min-height: 2.5rem;
        padding: 0.5rem 0.75rem;
        font: inherit;
        border-radius: 0.4rem;
      }

      input {
        border: 1px solid #9fb3c8;
      }

      button {
        border: 0;
        background: #1769aa;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome</h1>
      <p>Use the form below to enter a value.</p>
      <form aria-label="Example form">
        <label for="value">Your value</label>
        <input id="value" name="value" type="text" placeholder="Enter something">
        <button type="button">Continue</button>
      </form>
    </main>
  </body>
</html>
